name: Supabase Production Migrations

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type DEPLOY to repair the baseline history and apply pending migrations to Towber production
        type: string
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: lenstbxyyznbosljares
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require main and explicit production confirmation
        env:
          CONFIRMATION: ${{ inputs.confirm_production }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production migrations may only run from main."
            exit 1
          fi
          if [[ "$CONFIRMATION" != "DEPLOY" ]]; then
            echo "Type DEPLOY in the confirmation input to continue."
            exit 1
          fi

      - name: Check required secrets are present
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          if [[ -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::error::Missing repository secret SUPABASE_DB_PASSWORD."
            exit 1
          fi

      - name: Link the Towber project
        run: npx --yes supabase@2.119.0 link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Reconcile the existing baseline migration history
        run: npx --yes supabase@2.119.0 migration repair 20260930222400 --status applied --linked --yes

      - name: Reconcile service and vehicle migration version already applied
        run: npx --yes supabase@2.119.0 migration repair 20261002000004 --status applied --linked --yes

      - name: Apply pending versioned migrations
        run: npx --yes supabase@2.119.0 db push --linked --yes
